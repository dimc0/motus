# Les variables ${...} sont lues automatiquement depuis le fichier .env
services:
  app:
    build: .
    ports:
      - "8000:80"          # client.php appelle http://localhost:8000
    volumes:
      - ./:/var/www/html   # le code est monté : les modifs sont visibles sans rebuild
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"        # 3306 est déjà pris par le MySQL installé sur le PC
    volumes:
      - db_data:/var/lib/mysql
      - ./stuff/native_php_restful_api.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./stuff/motus.sql:/docker-entrypoint-initdb.d/02-motus.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

volumes:
  db_data:
