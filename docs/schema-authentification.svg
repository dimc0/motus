<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect width="760" height="750" fill="#fff"/>
<rect x="35.0" y="20" width="150" height="40" fill="#fff" stroke="#000"/>
